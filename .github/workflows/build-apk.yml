name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release & Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies & Build Web Assets
        run: |
          cd ide-app
          npm ci || npm install
          npm run build
          npx cap sync android

      - name: Grant Execute Permission for Gradlew
        run: chmod +x ide-app/android/gradlew

      - name: Build Android Debug APK
        run: |
          cd ide-app/android
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vibe-IDE-Debug-APK
          path: ide-app/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release with direct APK download
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        with:
          tag_name: latest-apk
          name: "JARVIS Vibe IDE - Latest Android APK"
          body: "Direct APK download for JARVIS AI Mobile IDE. Tap the APK file below to install directly on Android!"
          files: ide-app/android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
